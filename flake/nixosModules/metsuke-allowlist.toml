# Generated, never hand-written:
#
#   metsuke-allowlist query \
#     --socket-dir <dbsync socket dir> \
#     --dbname <db> \
#     --role <role> \
#     --metadata-label 674 \
#     --metadata-key musashinet_incentives_application_code \
#     --statement-timeout 30sec \
#     > registrations.csv
#
# Clean up the applications csv with:
#
#   nu -c "open --raw applications.csv
#     | from csv --no-infer
#     | select ...[
#         'Timestamp'
#         'Pool ID of a stake pool you run on MusashiNet.'
#         'Pool ID of a second stake pool you run on MusashiNet. (Optional)'
#         'Pool ID of a third stake pool you run on MusashiNet. (optional)'
#         'Registration code'
#       ]
#     | rename ts pool1 pool2 pool3 code
#     | to csv
#     | save applications-sanitized.csv"
#
#   metsuke-allowlist generate \
#     applications-sanitized.csv \
#     registrations.csv \
#     --code-column code \
#     --pool-columns pool1,pool2,pool3 \
#     > allowlist.toml \
#     2> rejected.txt
#
# Some rejected rows may prevent an allowlist from being made at all.  If os,
# examine the rejected.txt file and trim the application csv accordinly, then
# retry.  Iterate until successful:
#
#   metsuke-allowlist generate \
#     applications-sanitized-trimmed.csv \
#     registrations.csv \
#     --code-column code \
#     --pool-columns pool1,pool2,pool3 \
#     > allowlist.toml \
#     2> rejected-trimmed.txt
#
#
# Paste what `generate` emits over the table below, whole: it is regenerated
# rather than edited, so anything added here by hand is lost the next time.
# Manually curated pools go into metsuke-allowlist-manual.toml which are merged.
#
# `generate` excludes a pool whose application code disagrees with its current
# on-chain registration and says so on stderr, so read that too. It reports
# nothing about a pool that registered on chain and never applied; that set is
# the one with someone waiting on it, so compare the two lists as well.

