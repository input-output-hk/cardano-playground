---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: argocd
spec:
  project: cardano-playground
  source:
    repoURL: ssh://git@github.com/input-output-hk/cardano-playground
    targetRevision: main
    path: k8s/overlays/playground/external-dns

  destination:
    name: in-cluster

  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
