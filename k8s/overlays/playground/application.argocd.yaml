---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
spec:
  revisionHistoryLimit: 10
  project: cardano-playground
  source:
    repoURL: https://github.com/input-output-hk/cardano-playground
    # targetRevision: main
    targetRevision: prototype-webservices  # TODO
    path: k8s/overlays/playground/argocd

  destination:
    name: in-cluster

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true
