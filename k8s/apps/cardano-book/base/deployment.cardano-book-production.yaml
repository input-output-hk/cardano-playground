---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardano-book-production
  namespace: cardano-book
  labels:
    app.kubernetes.io/name: cardano-book-production
    app.kubernetes.io/part-of: cardano-book
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cardano-book-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cardano-book-production
    spec:
      containers:
      - name: cardano-book
        image: 015060878911.dkr.ecr.eu-central-1.amazonaws.com/cardano-book-production:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          periodSeconds: 30
          initialDelaySeconds: 10
          httpGet:
            port: http
            path: /
        readinessProbe:
          periodSeconds: 30
          initialDelaySeconds: 5
          httpGet:
            port: http
            path: /
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cardano-book-production
