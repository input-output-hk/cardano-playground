---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mdbook
  namespace: mdbook
  labels:
    app.kubernetes.io/name: mdbook
    app.kubernetes.io/part-of: mdbook
  annotations:
    # AWS Load Balancer Controller - shared ALB for both prod and staging
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
  - host: book-k8s.play.dev.cardano.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mdbook
            port:
              number: 80
  - host: book-staging-k8s.play.dev.cardano.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mdbook-staging
            port:
              number: 80
