---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdbook-staging
  namespace: mdbook
  labels:
    app.kubernetes.io/name: mdbook-staging
    app.kubernetes.io/part-of: mdbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdbook-staging
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdbook-staging
    spec:
      containers:
      - name: mdbook-staging
        image: 015060878911.dkr.ecr.eu-central-1.amazonaws.com/mdbook-staging:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          periodSeconds: 30
          initialDelaySeconds: 10
          httpGet:
            port: http
            path: /
        readinessProbe:
          periodSeconds: 30
          initialDelaySeconds: 5
          httpGet:
            port: http
            path: /
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
