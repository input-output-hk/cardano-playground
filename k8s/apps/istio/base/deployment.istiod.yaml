---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app: istiod
    app.kubernetes.io/name: istiod
    app.kubernetes.io/instance: istio
    app.kubernetes.io/part-of: istio
    istio: pilot
    istio.io/rev: default
    release: istio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: istiod
      istio: pilot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: istiod
        app.kubernetes.io/name: istiod
        app.kubernetes.io/instance: istio
        app.kubernetes.io/part-of: istio
        istio: pilot
        istio.io/dataplane-mode: none
        istio.io/rev: default
      annotations:
        prometheus.io/port: "15014"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: istiod
      containers:
      - name: discovery
        image: docker.io/istio/pilot:1.29.1-distroless
        imagePullPolicy: IfNotPresent
        args:
        - discovery
        - --monitoringAddr=:15014
        - --log_output_level=default:info
        - --domain
        - cluster.local
        - --keepaliveMaxServerConnectionAge
        - 30m
        env:
        - name: REVISION
          value: default
        - name: PILOT_CERT_PROVIDER
          value: istiod
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.serviceAccountName
        - name: KUBECONFIG
          value: /var/run/secrets/remote/config
        - name: CA_TRUSTED_NODE_ACCOUNTS
          value: istio-system/ztunnel
        - name: PILOT_ENABLE_AMBIENT
          value: "true"
        - name: PILOT_TRACE_SAMPLING
          value: "1"
        - name: PILOT_ENABLE_ANALYSIS
          value: "false"
        - name: CLUSTER_ID
          value: Kubernetes
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              divisor: "1"
              resource: limits.cpu
        - name: PLATFORM
          value: ""
        ports:
        - name: http-debug
          containerPort: 8080
          protocol: TCP
        - name: grpc-xds
          containerPort: 15010
          protocol: TCP
        - name: tls-xds
          containerPort: 15012
          protocol: TCP
        - name: https-webhooks
          containerPort: 15017
          protocol: TCP
        - name: http-monitoring
          containerPort: 15014
          protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 2048Mi
        readinessProbe:
          periodSeconds: 3
          initialDelaySeconds: 1
          timeoutSeconds: 5
          httpGet:
            port: 8080
            path: /ready
        volumeMounts:
        - name: istio-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        - name: local-certs
          mountPath: /var/run/secrets/istio-dns
        - name: cacerts
          mountPath: /etc/cacerts
          readOnly: true
        - name: istio-kubeconfig
          mountPath: /var/run/secrets/remote
          readOnly: true
        - name: istio-csr-dns-cert
          mountPath: /var/run/secrets/istiod/tls
          readOnly: true
        - name: istio-csr-ca-configmap
          mountPath: /var/run/secrets/istiod/ca
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      volumes:
      - name: local-certs
        emptyDir:
          medium: Memory
      - name: istio-token
        projected:
          sources:
          - serviceAccountToken:
              audience: istio-ca
              expirationSeconds: 43200
              path: istio-token
      - name: cacerts
        secret:
          secretName: cacerts
          optional: true
      - name: istio-kubeconfig
        secret:
          secretName: istio-kubeconfig
          optional: true
      - name: istio-csr-dns-cert
        secret:
          secretName: istiod-tls
          optional: true
      - name: istio-csr-ca-configmap
        configMap:
          name: istio-ca-root-cert
          defaultMode: 420
          optional: true
      tolerations:
      - key: cni.istio.io/not-ready
        operator: Exists
